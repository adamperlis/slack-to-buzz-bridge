# Co-hosted stack for an OCI Always Free Ampere A1 (ARM64) instance.
# Security posture: ONLY caddy publishes ports. Docker-published ports bypass
# the host's iptables INPUT chain entirely (DNAT → FORWARD), so anything
# published here is internet-reachable the moment the VCN security list
# allows it — keep the relay/db tier internal.
#
# The Buzz tier (buzz-relay + postgres + redis + minio) should follow the
# deployment shipped in github.com/block/buzz — the service shapes below
# mirror its architecture so the bridge wires in cleanly. Verify arm64
# manifests for Buzz's images before deploying; build from source if absent.
name: slack-buzz

networks:
  edge: {}
  internal:
    internal: true # no egress; relay/db tier only

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

  bridge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      BUZZ_RELAY_URL: ws://buzz-relay:8080
      BRIDGE_DB: /app/data/bridge.sqlite
    volumes:
      - bridge_data:/app/data
    depends_on: [buzz-relay]
    networks: [edge, internal]
    mem_limit: 256m

  buzz-relay:
    # Per block/buzz deployment docs — pin the release you validated.
    # image: <buzz-relay image or build from block/buzz source>
    build:
      context: ./buzz # place block/buzz's relay build context here
    restart: unless-stopped
    depends_on: [postgres, redis, minio]
    networks: [edge, internal] # edge so caddy can proxy team clients to it
    mem_limit: 1g

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [internal]
    mem_limit: 2g
    shm_size: 256m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]
    mem_limit: 256m

  minio:
    image: minio/minio
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    secrets: [minio_user, minio_password]
    volumes:
      - minio_data:/data
    networks: [internal]
    mem_limit: 512m

secrets:
  pg_password:
    file: ./secrets/pg_password
  minio_user:
    file: ./secrets/minio_user
  minio_password:
    file: ./secrets/minio_password

volumes:
  caddy_data: {}
  caddy_config: {}
  bridge_data: {}
  pg_data: {}
  minio_data: {}
