# Standalone bridge deployment: for teams whose Buzz hive is hosted
# elsewhere. Caddy terminates TLS; the bridge reaches the external Buzz
# relay via BUZZ_RELAY_URL from ../.env. Only Caddy publishes ports.
name: slack-buzz-bridge

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.bridge-only:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  bridge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      BRIDGE_DB: /app/data/bridge.sqlite
    volumes:
      - bridge_data:/app/data
    mem_limit: 256m

volumes:
  caddy_data: {}
  caddy_config: {}
  bridge_data: {}
