# Fly.io config. Setup:
#   fly launch --copy-config --no-deploy
#   fly volumes create bridge_data --size 1
#   fly secrets set SLACK_CLIENT_ID=… SLACK_CLIENT_SECRET=… \
#     SLACK_SIGNING_SECRET=… BUZZ_RELAY_URL=… \
#     BRIDGE_MASTER_KEY=$(openssl rand -hex 32)
#   fly deploy
# PUBLIC_BASE_URL is derived from the app name automatically.

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  BRIDGE_DB = "/app/data/bridge.sqlite"

[http_service]
  internal_port = 3000
  force_https = true
  # The bridge holds a live relay WebSocket — it must never scale to zero.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[[mounts]]
  source = "bridge_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
